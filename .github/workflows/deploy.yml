name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# least-privilege token for the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let an in-flight run finish rather than cancelling a publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA fallback: GitHub Pages serves 404.html for unknown deep links; making it a copy of
      # index.html lets BrowserRouter resolve /chickpea/studio, shareable seed URLs, etc. client-side.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
